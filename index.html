<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mavi Servis</title>
<style>
/* MAVİ SERVİS — sade, modern, mavi tonlarda arayüz */
:root {
  --blue-900: #072f5f; --blue-800: #0a3f7d; --blue-700: #0b4f9c; --blue-600: #1565c0; --blue-500: #1e7be0;
  --blue-100: #dceafb; --blue-50: #eef5fe;
  --bg: #f3f6fb; --card: #fff; --line: #dfe6ef; --line2: #edf1f6;
  --text: #15202e; --muted: #5c6b7f; --muted2: #8796a8;
  --green: #138a4b; --green-bg: #e3f5ea; --red: #c62828; --red-bg: #fdecec; --amber: #a86400; --amber-bg: #fff4dc;
  --orange: #c4570f; --orange-bg: #fdeee2; --purple: #6a3fc0; --purple-bg: #efe9fb; --teal: #00796b; --teal-bg: #e0f3f1;
  --radius: 10px; --shadow: 0 1px 2px rgba(16, 38, 70, .06), 0 2px 8px rgba(16, 38, 70, .05);
  --side-w: 264px; --top-h: 60px;
  font-size: 15px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; -webkit-text-size-adjust: 100%; }
body.no-scroll { overflow: hidden; }
a { color: var(--blue-600); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.45rem; margin: 0; }
h2 { font-size: 1.15rem; margin: 0 0 .6rem; }
h3 { font-size: 1.02rem; margin: 0; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .mt { margin-top: .75rem; } .mb { margin-bottom: .75rem; } .block { display: block; } .pad { padding: .8rem; }
.right { text-align: right; } .nowrap { white-space: nowrap; } .strong { font-weight: 600; }
.ic { width: 20px; height: 20px; fill: currentColor; flex: none; }
.boot, .loading-box { display: flex; gap: .6rem; align-items: center; justify-content: center; padding: 3rem; color: var(--muted); }
.spinner { width: 20px; height: 20px; border: 3px solid var(--blue-100); border-top-color: var(--blue-600); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Düğmeler & girişler */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 40px; padding: .45rem .95rem; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none !important; }
.btn:hover { background: var(--blue-50); border-color: #c7d6ea; }
.btn:focus-visible, .inp:focus-visible, .tab:focus-visible, a:focus-visible { outline: 3px solid rgba(30, 123, 224, .35); outline-offset: 1px; }
.btn.primary { background: var(--blue-700); border-color: var(--blue-700); color: #fff; }
.btn.primary:hover { background: var(--blue-800); }
.btn.success { background: var(--green); border-color: var(--green); color: #fff; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger-o { color: var(--red); border-color: #f0c4c4; }
.btn.danger-o:hover { background: var(--red-bg); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--blue-700); }
.btn.ghost-w { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .35); }
.btn.sm { min-height: 32px; padding: .25rem .65rem; font-size: .86rem; }
.btn.lg { min-height: 48px; font-size: 1.02rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.loading { position: relative; color: transparent !important; }
.btn.loading::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, .5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
.btn .ic { width: 18px; height: 18px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; color: inherit; position: relative; font-size: 1.1rem; }
.icon-btn:hover { background: var(--blue-50); }
.inp { width: 100%; min-height: 42px; padding: .5rem .7rem; border: 1px solid #cdd7e3; border-radius: 8px; font: inherit; font-size: 1rem; background: #fff; color: var(--text); }
textarea.inp { min-height: 70px; resize: vertical; }
.inp:focus { border-color: var(--blue-500); outline: none; box-shadow: 0 0 0 3px rgba(30, 123, 224, .15); }
.inp:disabled { background: #f2f4f7; }
select.inp { appearance: auto; }
label { font-weight: 600; font-size: .9rem; color: #2c3a4d; }
.check { display: inline-flex; align-items: center; gap: .45rem; font-weight: 500; cursor: pointer; min-height: 36px; }
.check input { width: 18px; height: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem 1rem; }
.form-grid.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field .help { color: var(--muted); font-size: .8rem; }
.field-err { color: var(--red); font-size: .83rem; min-height: 0; }
.field.has-err .inp { border-color: var(--red); background: #fffafa; }
.req { color: var(--red); }
.form-msg { color: var(--red); font-weight: 600; margin-top: .6rem; }
.form-msg:empty { display: none; }
.multicheck { display: flex; flex-wrap: wrap; gap: .1rem 1rem; padding: .3rem 0; }
.combo { position: relative; }
.combo-list { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin-top: 2px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(10, 30, 60, .15); max-height: 290px; overflow: auto; }
.combo-item { display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: .55rem .75rem; cursor: pointer; font: inherit; border-bottom: 1px solid var(--line2); }
.combo-item small { display: block; color: var(--muted); }
.combo-item:hover, .combo-item.active { background: var(--blue-50); }
.combo-item.create { color: var(--blue-700); font-weight: 600; }
.combo-empty { padding: .6rem .75rem; color: var(--muted); }

/* ---------- Kabuk */
.shell { min-height: 100vh; }
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: linear-gradient(180deg, var(--blue-800), var(--blue-900)); color: #dbe8f8; display: flex; flex-direction: column; z-index: 50; }
.brand { display: flex; gap: .65rem; align-items: center; padding: 1rem 1rem .8rem; color: #fff; }
.brand b { display: block; letter-spacing: .04em; } .brand small { display: block; font-size: .78rem; opacity: .75; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side nav { flex: 1; overflow-y: auto; padding: .3rem .55rem; }
.side nav a { display: flex; align-items: center; gap: .7rem; padding: .62rem .7rem; border-radius: 8px; color: #d4e3f6; font-weight: 500; font-size: .93rem; text-decoration: none; position: relative; }
.side nav a:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.side nav a.active { background: #fff; color: var(--blue-800); font-weight: 650; }
.side-user { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .8rem 1rem; border-top: 1px solid rgba(255, 255, 255, .12); }
.side-user b { display: block; color: #fff; font-size: .9rem; } .side-user small { opacity: .75; font-size: .78rem; }
.side-backdrop { display: none; }
.main-col { margin-left: var(--side-w); min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 40; height: var(--top-h); background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .7rem; padding: 0 1.2rem; }
.menu-btn { display: none; }
.gsearch { position: relative; flex: 1; max-width: 560px; display: flex; align-items: center; }
.gsearch > .ic { position: absolute; left: .7rem; color: var(--muted2); }
.gsearch input { width: 100%; height: 40px; border: 1px solid var(--line); background: var(--bg); border-radius: 20px; padding: 0 1rem 0 2.4rem; font: inherit; }
.gsearch input:focus { outline: none; border-color: var(--blue-500); background: #fff; }
.gsearch-res { position: absolute; top: 46px; left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(10, 30, 60, .18); max-height: 70vh; overflow: auto; z-index: 60; }
.gsearch-res h6 { margin: 0; padding: .5rem .8rem .2rem; font-size: .72rem; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
.gsearch-res a { display: block; padding: .5rem .8rem; color: var(--text); border-bottom: 1px solid var(--line2); }
.gsearch-res a:hover { background: var(--blue-50); text-decoration: none; }
.gsearch-res small { color: var(--muted); }
.bell { margin-left: auto; color: var(--blue-800); }
.nbadge { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: .7rem; font-style: normal; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.side nav a .nbadge { position: static; margin-left: auto; }
#page { padding: 1.3rem 1.4rem 2rem; max-width: 1500px; width: 100%; outline: none; }
.bottom-nav { display: none; }

/* ---------- Sayfa öğeleri */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.1rem; flex-wrap: wrap; }
.page-head .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.page-head p { margin: .2rem 0 0; }
.back { display: inline-flex; align-items: center; gap: .3rem; font-size: .9rem; margin-bottom: .4rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.1rem; min-width: 0; }
.card + .card { margin-top: 1rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-bottom: .75rem; flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; }
.grid { display: grid; gap: 1rem; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
.grid > .card + .card { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: .85rem; margin-bottom: 1rem; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--shadow); text-decoration: none !important; color: inherit; display: block; border-left: 4px solid var(--blue-500); transition: transform .1s; }
a.stat:hover { transform: translateY(-1px); border-color: #c7d6ea; }
.stat small { color: var(--muted); font-weight: 600; font-size: .82rem; display: block; }
.stat b { font-size: 1.6rem; display: block; margin-top: .15rem; color: var(--blue-900); }
.stat .sub { font-size: .8rem; color: var(--muted); }
.stat.green { border-left-color: var(--green); } .stat.red { border-left-color: var(--red); } .stat.amber { border-left-color: #e0a100; } .stat.purple { border-left-color: var(--purple); } .stat.teal { border-left-color: var(--teal); }
.stat.red b { color: var(--red); }
.toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: .9rem; }
.toolbar .inp { width: auto; min-width: 150px; flex: 0 1 auto; }
.toolbar .grow { flex: 1 1 240px; }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .8rem; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 18px; padding: .32rem .8rem; font: inherit; font-size: .87rem; cursor: pointer; font-weight: 600; color: var(--muted); }
.chip.active { background: var(--blue-700); border-color: var(--blue-700); color: #fff; }
.tabs { display: flex; gap: .2rem; border-bottom: 2px solid var(--line); margin-bottom: 1rem; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: .65rem .9rem; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab.active { color: var(--blue-700); border-bottom-color: var(--blue-700); }
.tab .cnt { background: var(--blue-50); color: var(--blue-700); border-radius: 10px; padding: 0 .45rem; font-size: .78rem; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .35rem .9rem; font-size: .93rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.empty { padding: 1.6rem 1rem; text-align: center; color: var(--muted); background: #fafcff; border: 1px dashed var(--line); border-radius: 8px; }
.empty.big { padding: 3rem; }
.error-box { background: var(--red-bg); border: 1px solid #f3c2c2; color: #7d1c1c; padding: 1.2rem; border-radius: 10px; }
.notice { background: var(--blue-50); border: 1px solid var(--blue-100); color: var(--blue-900); padding: .75rem .9rem; border-radius: 8px; font-size: .92rem; }
.notice.warn { background: var(--amber-bg); border-color: #f2d898; color: #6d4300; }
.notice.danger { background: var(--red-bg); border-color: #f3c2c2; color: #7d1c1c; }
.notice.ok { background: var(--green-bg); border-color: #b9e3c9; color: #0d5e33; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: .6rem 0; border-bottom: 1px solid var(--line2); display: flex; justify-content: space-between; gap: .6rem; align-items: center; }
.list li:last-child { border-bottom: 0; }
.list a.row-link { color: inherit; display: block; flex: 1; min-width: 0; }
.list small { color: var(--muted); display: block; }
.bar { height: 8px; background: var(--line2); border-radius: 4px; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--blue-500); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 1rem; border-left: 2px solid var(--blue-100); }
.timeline li { position: relative; padding: 0 0 .9rem .7rem; }
.timeline li::before { content: ""; position: absolute; left: -1.43rem; top: .35rem; width: 10px; height: 10px; border-radius: 50%; background: var(--blue-500); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--blue-100); }
.timeline small { color: var(--muted); display: block; }
.totals { width: 100%; max-width: 380px; margin-left: auto; border-collapse: collapse; }
.totals td { padding: .3rem 0; } .totals td:last-child { text-align: right; font-weight: 600; }
.totals tr.grand td { border-top: 2px solid var(--text); font-size: 1.12rem; padding-top: .5rem; }
.totals tr.bal td { color: var(--red); }
.status-steps { display: flex; flex-wrap: wrap; gap: .35rem; }

/* ---------- Rozetler */
.badge { display: inline-block; padding: .14rem .55rem; border-radius: 12px; font-size: .78rem; font-weight: 650; white-space: nowrap; vertical-align: middle; }
.st-blue { background: var(--blue-100); color: var(--blue-800); } .st-blue2 { background: #d6e8ff; color: #0b4f9c; }
.st-gray { background: #e7ebf0; color: #43515f; } .st-light { background: #f0f3f7; color: #5c6b7f; }
.st-purple { background: var(--purple-bg); color: var(--purple); } .st-amber { background: var(--amber-bg); color: var(--amber); }
.st-orange { background: var(--orange-bg); color: var(--orange); } .st-teal { background: var(--teal-bg); color: var(--teal); }
.st-green { background: var(--green-bg); color: var(--green); } .st-dark { background: #2c3a4d; color: #fff; } .st-red { background: var(--red-bg); color: var(--red); }
.badge.sample { background: #fff0c2; color: #7a5800; border: 1px dashed #d9b44a; font-size: .68rem; letter-spacing: .04em; }
.late { color: var(--red); font-weight: 650; }

/* ---------- Tablolar */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th { text-align: left; background: #f6f9fd; color: #3d4b5e; font-weight: 650; padding: .6rem .7rem; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: .84rem; }
.tbl td { padding: .6rem .7rem; border-bottom: 1px solid var(--line2); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--blue-50); }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
.tbl small { color: var(--muted); display: block; }
.tbl .actions-cell { white-space: nowrap; text-align: right; }
.tbl td.actions-cell .cv { display: inline-flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
tr.row-late td:first-child { box-shadow: inset 3px 0 0 var(--red); }
tr.row-crit td:first-child { box-shadow: inset 3px 0 0 #e0a100; }

/* ---------- Modal */
.modal-wrap { position: fixed; inset: 0; background: rgba(8, 24, 48, .45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 680px; max-height: calc(100vh - 2rem); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.modal.sm { max-width: 440px; } .modal.lg { max-width: 920px; } .modal.xl { max-width: 1150px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: .85rem 1.1rem; border-bottom: 1px solid var(--line); }
.modal-body { padding: 1rem 1.1rem; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: .5rem; padding: .75rem 1.1rem; border-top: 1px solid var(--line); flex-wrap: wrap; }
.confirm-msg { font-size: 1rem; }
.confirm-msg ul { padding-left: 1.2rem; }
#toasts { position: fixed; z-index: 200; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; max-width: min(420px, calc(100vw - 2rem)); }
.toast { background: #12355f; color: #fff; padding: .75rem 1rem; border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); font-weight: 500; transition: opacity .4s, transform .4s; border-left: 4px solid #4fc27e; }
.toast.err { background: #6d1717; border-left-color: #ff8a8a; }
.toast.warn { background: #5c3d00; border-left-color: #ffc94a; }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- Giriş */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background: radial-gradient(circle at 20% 10%, #1e7be0 0, #0b4f9c 35%, #072f5f 100%); }
.login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 14px; padding: 1.8rem; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); display: flex; flex-direction: column; gap: .85rem; }
.login-card label { display: flex; flex-direction: column; gap: .3rem; }
.login-brand { display: flex; gap: .8rem; align-items: center; margin-bottom: .4rem; }
.login-brand h1 { color: var(--blue-800); letter-spacing: .05em; } .login-brand p { margin: 0; color: var(--muted); }
.login-card .form-grid { grid-template-columns: 1fr; }

/* ---------- Fotoğraf / işaretleme */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; }
.photo { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
.photo .img-box { position: relative; aspect-ratio: 4/3; background: #eef2f7; cursor: zoom-in; overflow: hidden; }
.photo .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .meta { padding: .4rem .5rem; font-size: .82rem; }
.photo .meta b { display: block; }
.photo .acts { display: flex; gap: .25rem; padding: 0 .4rem .4rem; flex-wrap: wrap; }
.mark { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #fff; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .4); pointer-events: none; }
.annot-stage { position: relative; display: inline-block; max-width: 100%; touch-action: manipulation; user-select: none; }
.annot-stage img { max-width: 100%; max-height: 62vh; display: block; cursor: crosshair; }
.annot-stage .mark { pointer-events: auto; cursor: pointer; width: 28px; height: 28px; }
.annot-list { list-style: none; padding: 0; margin: .6rem 0 0; display: flex; flex-direction: column; gap: .4rem; }
.annot-list li { display: flex; gap: .5rem; align-items: center; }
.annot-list .num { width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; flex: none; }
.upload-zone { border: 2px dashed #b9cbe2; border-radius: 10px; padding: 1rem; text-align: center; background: #f8fbff; }
.upload-zone .btns { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-top: .5rem; }
.diagram-box { max-width: 420px; }

/* ---------- Takvim */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.cal .dow { background: #f6f9fd; padding: .45rem; font-weight: 650; font-size: .8rem; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line); }
.cal .day { min-height: 98px; border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); padding: .3rem; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }

.cal .day.sel { box-shadow: inset 0 0 0 2px var(--blue-500); }

.cal .more { font-size: .7rem; color: var(--muted); }
.cal-nav { display: flex; align-items: center; gap: .5rem; }
.cal-nav h3 { min-width: 150px; text-align: center; }

/* ---------- Kanban benzeri durum sayaçları */
.status-strip { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .3rem; margin-bottom: .9rem; scrollbar-width: thin; }
.status-strip button { flex: none; }

/* ---------- Yazdırma alanı */
#print-root { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
}
.doc { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: 10.5pt; line-height: 1.35; }
.doc .doc-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #0b4f9c; padding-bottom: 8px; margin-bottom: 10px; }
.doc .doc-head h1 { font-size: 15pt; color: #0b4f9c; margin: 0; }
.doc .doc-head .biz { font-size: 9pt; color: #333; }
.doc .doc-title { text-align: right; }
.doc .doc-title h2 { margin: 0; font-size: 14pt; }
.doc .doc-title .no { font-size: 12pt; font-weight: 700; color: #0b4f9c; }
.doc h3 { font-size: 10.5pt; background: #eef5fe; color: #0a3f7d; padding: 4px 6px; margin: 10px 0 4px; border-left: 3px solid #0b4f9c; }
.doc table { width: 100%; border-collapse: collapse; }
.doc table.dt td, .doc table.dt th { border: 1px solid #999; padding: 4px 6px; text-align: left; vertical-align: top; }
.doc table.dt th { background: #f0f3f7; font-size: 9pt; }
.doc .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.doc .kvp td { padding: 2px 4px; vertical-align: top; } .doc .kvp td:first-child { color: #444; width: 40%; }
.doc .num { text-align: right !important; white-space: nowrap; }
.doc .sum { width: 50%; margin-left: auto; margin-top: 6px; }
.doc .sum td { padding: 3px 6px; border-bottom: 1px solid #ddd; } .doc .sum td:last-child { text-align: right; }
.doc .sum tr.g td { font-size: 12pt; font-weight: 700; border-top: 2px solid #000; }
.doc .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 22px; }
.doc .sign div { border-top: 1px solid #000; padding-top: 4px; text-align: center; font-size: 9pt; height: 70px; }
.doc .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.doc .photos figure { margin: 0; border: 1px solid #ccc; page-break-inside: avoid; }
.doc .photos .pimg { position: relative; }
.doc .photos img { width: 100%; display: block; max-height: 150px; object-fit: cover; }
.doc .photos figcaption { font-size: 8pt; padding: 2px 4px; }
.doc .mark { width: 16px; height: 16px; font-size: 8pt; border-width: 1px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.doc .foot { margin-top: 14px; font-size: 8.5pt; color: #444; border-top: 1px solid #ccc; padding-top: 6px; }
.doc .box { border: 1px solid #999; padding: 6px; min-height: 30px; white-space: pre-wrap; }
.doc .rep-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.doc .rep-stats div { border: 1px solid #bbb; padding: 6px; } .doc .rep-stats b { display: block; font-size: 13pt; }
.preview-doc { background: #fff; padding: 1.2rem; border: 1px solid var(--line); }

/* ---------- Duyarlı (mobil) */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-main { grid-template-columns: 1fr; }
}
@media (max-width: 1023px) {

}

  .bottom-nav .fab span { color: var(--blue-700); }
  .bottom-nav .nbadge { top: 0; right: calc(50% - 22px); }
  .bell { display: none; }

  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }

  .tbl td > .cv { text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .tbl td:first-child > .cv { text-align: left; flex: 1; }

  .tbl td .inp { max-width: 100%; }
  .tbl td.actions-cell { justify-content: flex-end; flex-wrap: wrap; }

  .modal-wrap { padding: 0; align-items: flex-end; }

  .cal .day.has-ev::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--blue-500); margin: 2px auto 0; }

  .kv { grid-template-columns: 1fr; gap: .05rem; } .kv dt { margin-top: .4rem; font-size: .82rem; }

  .photo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.grid > * { min-width: 0; }

/* Alan tanımı: {name,label,type,required,options:[v|[v,l]],placeholder,help,full,min,max,step,rows,source,initialLabel,disabled}

}

function bindForm(root, fields) {

function marksHtml(marks) {
  return (marks || []).map((m, i) => `<span class="mark" style="left:${m.x * 100}%;top:${m.y * 100}%">${i + 1}</span>`).join('');
}

function head(title, no, sub = '') {
  const s = S();
  return `<div class="doc-head"><div><h1>${esc(s.business_name || 'Mavi Servis')}</h1><div class="biz">${esc(s.business_address || '')}<br>

function photosHtml(photos, title) {
  if (!photos.length) return '';
  return `<h3>${esc(title)}</h3><div class="photos">${photos.map((p) => `<figure><div class="pimg"><img ${upAttr(p.filename)} alt="">${marksHtml(p.annotations)}</div>
    <figcaption><b>${esc(p.category)}</b> ${esc(p.caption || '')}${(p.annotations || []).length ? '<br>' + p.annotations.map((a, i) => `${i + 1}) ${esc(a.note || '')}`).join(' ') : ''}</figcaption></figure>`).join('')}</div>`;
}

function itemsTable(items, withApproval = false) {
  const rows = items.filter((i) => i.approval_status !== 'Reddedildi');
  if (!rows.length) return '<div class="box">Kalem eklenmemiş.</div>';
  return `<table class="dt"><thead><tr><th>Tür</th><th>Açıklama</th><th class="num">Miktar</th><th class="num">Birim fiyat</th><th class="num">Tutar</th>${withApproval ? '<th>Onay</th>' : ''}</tr></thead><tbody>
    ${rows.map((i) => `<tr><td>${esc(i.type)}</td><td>${esc(i.description)}${i.part_code ? ` <small>(${esc(i.part_code)})</small>` : ''}</td><td class="num">${num(i.qty)}</td><td class="num">${money(i.unit_price)}</td><td class="num">${money(i.qty * i.unit_price)}</td>${withApproval ? `<td>${esc(i.approval_status)}</td>` : ''}</tr>`).join('')}

}

function sumTable(t, withPaid = true) {
  return `<table class="sum"><tr><td>Parça tutarı</td><td>${money(t.parts_total)}</td></tr><tr><td>İşçilik tutarı</td><td>${money(t.labor_total)}</td></tr>

    <div><h3>Motor arıza / kontrol noktaları</h3><div style="display:flex;gap:8px"><div class="pimg" style="position:relative;width:120px;flex:none"><img src="${CAR_SVG}" style="width:100%">${marksHtml(w.damage_marks)}</div>

  <h3>Müşteri şikâyeti</h3><div class="box">${esc(w.complaint)}</div>
  ${w.requested_work ? `<h3>İstenen işlemler</h3><div class="box">${esc(w.requested_work)}</div>` : ''}
  ${w.intake_notes ? `<h3>Kabul notları</h3><div class="box">${esc(w.intake_notes)}</div>` : ''}

}

function workOrderDoc(d, { prices = true } = {}) {
  const w = d.wo;
  return `<div class="doc">${head('İŞ EMRİ', w.wo_no, `Durum: <b>${esc(w.status)}</b> • Öncelik: ${esc(w.priority)}`)}${custVeh(d)}

}

function deliveryDoc(d) {

  <h3>Değiştirilen parçalar</h3>${parts.length ? `<table class="dt"><thead><tr><th>Kod</th><th>Parça</th><th class="num">Miktar</th><th class="num">Birim</th><th class="num">Tutar</th></tr></thead><tbody>
    ${parts.map((i) => `<tr><td>${esc(i.part_code || '-')}</td><td>${esc(i.description)}</td><td class="num">${num(i.qty)}</td><td class="num">${money(i.unit_price)}</td><td class="num">${money(i.qty * i.unit_price)}</td></tr>`).join('')}</tbody></table>` : '<div class="box">Parça değişimi yapılmadı.</div>'}
  ${sumTable(d.totals)}

  ${w.service_notes ? `<h3>Servis notları</h3><div class="box">${esc(w.service_notes)}</div>` : ''}
  ${photosHtml(d.photos.filter((p) => p.category === 'Teslim'), 'Teslim fotoğrafları')}
  <div class="foot">${esc(S().delivery_footer || '')}<br>Bu form bilgilendirme amaçlıdır; resmî fatura/e-arşiv belgesi yerine geçmez.</div>
  <div class="sign"><div>Teslim alan müşteri<br>${esc(w.delivery_received_by || 'Ad soyad')} / imza</div><div>Teslim eden servis yetkilisi<br>${esc(d.advisor?.full_name || '')}</div></div></div>`;
}

function printHtml(html) {
  if (window.MS_PRINT) return window.MS_PRINT(html);
  const root = document.getElementById('print-root');
  root.innerHTML = html;
  const imgs = [...root.querySelectorAll('img')];
  Promise.all(imgs.map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = i.onerror = r; })))).then(() => {
    setTimeout(() => { window.print(); }, 50);
  });
  toast('Yazdırma penceresinde hedef olarak "PDF olarak kaydet" seçerek PDF alabilirsiniz.');
}

const initials = (n) => String(n || '?').split(/\s+/).map((x) => x[0]).slice(0, 2).join('').toUpperCase();
const avatar = (u, cls) => `<div class="${cls}" ${cls === 'tb-av' ? 'data-photo title="Fotoğrafı değiştir"' : ''}>${u.photo ? `<img src="${esc(u.photo)}" alt="">` : esc(initials(u.full_name))}</div>`;
const plate = (p) => `<span class="tb-plate">${esc(p || '—')}</span>`;

// ------------------------------------------------------------------ Çevrimdışı kuyruk (tablet)
function qLoad() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch { return []; } }
function qSave(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch { toast('Tablet hafızası dolu; fotoğraflar kuyruğa alınamadı.', 'err'); } }
const isNet = (e) => e && (e.status === 0 || /ulaşılamıyor|network|failed to fetch/i.test(e.message || ''));
let flushing = false;

/** Fotoğrafı (varsa) yükleyip parça işaretlerini gönderir. Ağ yoksa kuyruğa alır. */
async function sendChecks(job, opts = {}) {
  const items = [];
  for (const it of job.items) {
    const o = { ...it };
    if (o.photoData) {
      const r = await post(`/api/workorders/${job.wo_id}/photos`, { category: 'Diğer', caption: 'Parça: ' + (o.part_name || ''), data: o.photoData });
      o.photo = r.filename; delete o.photoData;
      it.photo = r.filename; delete it.photoData; // tekrar denenirse ikinci kez yüklenmesin
    }
    delete o.part_name;
    items.push(o);
  }
  return post(`/api/workorders/${job.wo_id}/part-checks`, { items, submit: !!job.submit, note: job.note || '' , ...opts });
}
async function submitOrQueue(job) {
  try { return { ok: true, res: await sendChecks(job) }; }
  catch (e) {
    if (!isNet(e)) throw e;
    const q = qLoad(); q.push({ ...job, at: Date.now() }); qSave(q);
    return { ok: false, queued: true };
  }
}
async function flushTabletQueue() {
  if (flushing) return 0;
  let q = qLoad(); if (!q.length) return 0;
  flushing = true; let sent = 0;
  try {
    while (q.length) {
      const job = q[0];
      try { await sendChecks(job); }
      catch (e) {
        if (isNet(e)) { qSave(q); break; } // hâlâ internet yok: sırayı koru
        toast('Kuyruktaki bir kayıt gönderilemedi: ' + e.message, 'err');
      }
      q.shift(); qSave(q); sent++;
    }
  } finally { flushing = false; }
  if (sent) toast(sent + ' bekleyen tablet kaydı sunucuya gönderildi.');
  return sent;
}
window.addEventListener('online', () => setTimeout(flushTabletQueue, 1500));
setInterval(() => { if (qLoad().length) flushTabletQueue(); }, 20000);

  ensureStyle();
  await flushTabletQueue().catch(() => 0);
  const [me, jobs] = await Promise.all([get('/api/me/profile'), get('/api/tablet/jobs')]);
  if (!alive()) return;
  if (woId) { const j = jobs.items.find((x) => x.wo_id === woId); if (j) return jobView(el, j, me, alive); }
  const q = qLoad();
  const stBtn = (s, label) => `<button data-st="${s}" class="${me.status === s ? 'on' : ''}">${label}</button>`;
  el.innerHTML = `<div class="tb">
    <div class="tb-prof">${avatar(me, 'tb-av')}
      <div class="grow"><h2>${esc(me.full_name)}</h2><small>${esc(me.title || 'Usta / Teknisyen')}</small><div class="mt">${badge(me.status)}${me.pending ? ' ' + badge('Onay bekliyor') + ` <small>${me.pending} gönderim</small>` : ''}</div></div>
      <div class="tb-stbtn">${stBtn('Müsait', '🟢 Müsait')}${stBtn('Molada', '☕ Moladayım')}</div>

    </div>
    ${q.length ? `<div class="tb-q">📶 İnternet gelince gönderilecek <b>${q.length}</b> kayıt var. <button class="btn sm" data-flush>Şimdi gönder</button></div>` : ''}
    <h2 class="mb">Bana atanan araçlar <small class="muted">(${jobs.items.length})</small></h2>
    ${jobs.items.length ? `<div class="tb-jobs">${jobs.items.map((j) => `<button class="tb-job" data-wo="${j.wo_id}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${plate(j.plate)} ${badge(j.priority)}</div>
        <div class="tb-meta"><b style="font-size:1.1rem">${esc(j.brand || '')} ${esc(j.model || '')}</b> ${j.year ? esc(j.year) : ''}<br>
        👤 ${esc(j.customer || '')}<br>📋 ${esc(j.wo_no)} • ${esc(j.task_title || '')}<br><span class="muted">${esc((j.complaint || '').slice(0, 90))}</span></div>
        <div class="tb-cnt">${badge(j.task_status)}${j.marked ? ` <span class="badge st-light">${j.marked} işaretli</span>` : ''}${j.pending ? ' ' + badge('Onay bekliyor') : ''}${j.corrections ? ` <span class="badge st-red">${j.corrections} düzeltme</span>` : ''}${j.approved ? ` <span class="badge st-green">${j.approved} onaylı</span>` : ''}</div>
      </button>`).join('')}</div>`
    : `<div class="empty big">Şu an size atanmış aktif bir araç yok.<br><small class="muted">Yönetici yeni bir araç atadığında burada görünür. Durumunuzu "Müsait" tutun.</small></div>`}
  </div>`;
  el.querySelectorAll('[data-wo]').forEach((b) => (b.onclick = () => { location.hash = '#/tablet/' + b.dataset.wo; }));
  el.querySelectorAll('[data-st]').forEach((b) => (b.onclick = async () => {
    try { await put('/api/me/status', { status: b.dataset.st }); toast('Durumunuz: ' + b.dataset.st); tabletPage(el, null, alive); } catch (e) { showError(e); }
  }));
  el.querySelector('[data-flush]')?.addEventListener('click', async () => { await flushTabletQueue(); tabletPage(el, null, alive); });
  bindPhotoChange(el, me.id, () => tabletPage(el, null, alive));
  // Yeni atama gelirse ekranı kendiliğinden yenile
  clearTimeout(window._tbTimer);
  window._tbTimer = setTimeout(function tick() {
    if (!alive() || !/^#\/tablet$/.test(location.hash)) return;
    if (document.querySelector('.modal-wrap')) { window._tbTimer = setTimeout(tick, 20000); return; }
    tabletPage(el, null, alive).catch(() => {});
  }, 30000);
}

function bindPhotoChange(el, uid, done) {
  const inp = el.querySelector('[data-photo-in]'); const av = el.querySelector('[data-photo]');
  if (!inp || !av) return;
  av.onclick = () => inp.click();
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { const data = await resizeImage(f, 240, 0.72); await put(`/api/users/${uid}/photo`, { photo: data }); toast('Fotoğraf güncellendi.'); if (state.user.id === uid) state.user.photo = data; done(); }
    catch (e) { showError(e); }
  };
}

// ------------------------------------------------------------------ Araç / parça işaretleme ekranı
async function jobView(el, job, me, alive) {
  let pc = await get(`/api/workorders/${job.wo_id}/part-checks`);
  if (!alive()) return;
  const draft = {}; // part_def_id -> {status,note,photo,photoData,dirty,remove}
  let group = Number(sessionStorage.getItem('tb_grp_' + job.wo_id)) || pc.groups[0]?.id;
  const firstFix = pc.checks.find((c) => c.user_id === me.id && c.review_status === 'Düzeltme istendi');
  if (firstFix) { const fg = pc.groups.find((g) => g.parts.some((p) => p.id === firstFix.part_def_id)); if (fg) group = fg.id; }
  if (!pc.groups.some((g) => g.id === group)) group = pc.groups[0]?.id;
  const mine = () => {
    const m = {};
    pc.checks.filter((c) => c.user_id === me.id).forEach((c) => {
      const cur = m[c.part_def_id];
      if (!cur || (cur.review_status === 'Onaylandı' && c.review_status !== 'Onaylandı') || (c.review_status !== 'Onaylandı' && c.updated_at > cur.updated_at)) m[c.part_def_id] = c;
    });
    return m;
  };
  const partName = (id) => { for (const g of pc.groups) { const p = g.parts.find((x) => x.id === id); if (p) return p.name; } return ''; };
  const dirtyCount = () => Object.values(draft).filter((d) => d.dirty).length;

  function render() {
    const M = mine();
    const fixes = pc.checks.filter((c) => c.user_id === me.id && c.review_status === 'Düzeltme istendi');
    const drafts = pc.checks.filter((c) => c.user_id === me.id && c.review_status === 'Taslak').length;
    const g = pc.groups.find((x) => x.id === group) || pc.groups[0];
    const cnt = (gr) => gr.parts.filter((p) => M[p.id] || draft[p.id]?.status).length;
    el.innerHTML = `<div class="tb">
      <a class="back" href="#/tablet">‹ İşlerim</a>
      <div class="card"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${plate(job.plate)}
        <div style="flex:1;min-width:200px"><b style="font-size:1.25rem">${esc(job.brand || '')} ${esc(job.model || '')}</b> ${esc(job.year || '')} ${job.fuel ? '• ' + esc(job.fuel) : ''}<br>
        <span class="muted">👤 ${esc(job.customer || '')} ${job.customer_phone ? '• ' + esc(job.customer_phone) : ''} • KM: ${esc(job.km_in || '—')}</span></div>
        <div>${badge(job.priority)} ${badge(job.task_status)}</div></div>
        <dl class="kv mt"><dt>İş emri</dt><dd>${esc(job.wo_no)} — ${esc(job.task_title || '')}</dd>
        <dt>Şikâyet</dt><dd>${esc(job.complaint || '—')}</dd><dt>İstenen işlem</dt><dd>${esc(job.requested_work || '—')}</dd>
        ${job.task_description ? `<dt>Görev notu</dt><dd>${esc(job.task_description)}</dd>` : ''}<dt>Tahmini teslim</dt><dd>${fdt(job.estimated_at)}</dd></dl></div>
      ${fixes.length ? `<div class="tb-fixnote"><b>⚠ Yönetici ${fixes.length} parçada düzeltme istedi:</b> ${esc(fixes[0].review_note || '')}<br><small>Kırmızı işaretli parçaları düzeltip tekrar "Onaya gönder" deyin.</small></div>` : ''}
      <div class="tb-groups">${pc.groups.map((gr) => `<button class="tb-grp ${gr.id === g?.id ? 'on' : ''}" data-g="${gr.id}">${esc(gr.name)}<small>${cnt(gr)} / ${gr.parts.length} işaretli</small></button>`).join('')}</div>
      <div data-parts>${g ? g.parts.map((p) => partRow(p, M[p.id])).join('') : '<div class="empty">Parça kategorisi tanımlı değil.</div>'}</div>
      <div class="tb-bar">
        <span class="grow" style="flex:1"><b data-dc>${dirtyCount() + drafts}</b> parça onaya gönderilmeyi bekliyor</span>
        <button class="btn" data-save>💾 Kaydet</button>
        <button class="btn primary" data-submit>📤 Onaya gönder</button>
        <button class="btn" data-finish style="background:#2e7d32;color:#fff;border-color:#2e7d32">✅ İşi bitirdim</button>
      </div>
    </div>`;
    bind();
  }

  function partRow(p, c) {
    const d = draft[p.id] || {};
    const locked = (c && (c.review_status === 'Onay bekliyor' || c.review_status === 'Onaylandı') && !d.dirty && !d.queued) || d.queued;
    const status = d.remove ? null : d.status ?? (c && !(c.review_status === 'Onaylandı' && d.dirty) ? c.status : null);
    const note = d.note ?? (c?.note || '');
    const photo = d.photoData || (d.photo ?? c?.photo);
    const fix = c && c.review_status === 'Düzeltme istendi' && !d.dirty;
    const rs = d.dirty ? 'Kaydedilmedi' : d.queued ? 'Kuyrukta' : c?.review_status;
    return `<div class="tb-part ${status ? 'marked' : ''} ${locked ? 'locked' : ''} ${fix ? 'fix' : ''}" data-p="${p.id}">
      <div class="tb-phead"><b>${esc(p.name)}</b>${rs ? (rs === 'Kaydedilmedi' || rs === 'Kuyrukta' ? `<span class="badge st-amber">${rs === 'Kuyrukta' ? '📶 İnternet bekleniyor' : 'Kaydedilmedi'}</span>` : badge(rs)) : ''}${c?.reviewer_name && c.review_status !== 'Onay bekliyor' && c.review_status !== 'Taslak' ? ` <small class="muted">${esc(c.reviewer_name)}</small>` : ''}</div>
      ${fix && c.review_note ? `<div class="tb-fixnote" style="margin:6px 0 0">${esc(c.review_note)}</div>` : ''}
      <div class="tb-sts">${CHECK_STATUSES.map((s) => `<button data-s="${s}" class="${status === s ? 'on' : ''}" ${locked ? 'disabled' : ''}>${ST_ICON[s]} ${esc(s)}</button>`).join('')}</div>
      ${status || note || photo ? `<div class="tb-extra">
        <textarea class="inp" data-note placeholder="Not (isteğe bağlı)" ${locked ? 'disabled' : ''}>${esc(note)}</textarea>
        ${photo ? (String(photo).startsWith('data:') ? `<img class="tb-thumb" src="${esc(photo)}" alt="">` : `<img class="tb-thumb" ${upAttr(photo)} alt="">`) : ''}
        ${locked ? '' : `<button class="btn" data-ph>📷 ${photo ? 'Değiştir' : 'Fotoğraf'}</button><input type="file" accept="image/*" capture="environment" data-phin hidden>`}
      </div>` : ''}
    </div>`;
  }

  function bind() {
    el.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => { group = Number(b.dataset.g); sessionStorage.setItem('tb_grp_' + job.wo_id, group); render(); }));
    el.querySelectorAll('[data-p]').forEach((row) => {
      const pid = Number(row.dataset.p); const M = mine(); const c = M[pid];
      const d = () => (draft[pid] = draft[pid] || {});
      row.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => {
        const cur = row.querySelector('[data-s].on')?.dataset.s;
        const x = d();
        if (cur === b.dataset.s) { x.status = null; x.remove = true; } else { x.status = b.dataset.s; x.remove = false; }
        x.dirty = true; rerow(pid);
      }));
      const n = row.querySelector('[data-note]');
      if (n) n.oninput = () => { const x = d(); x.note = n.value; if (!x.status && !x.remove) x.status = c?.status; x.dirty = true; updateCount(); };
      const ph = row.querySelector('[data-ph]'), pin = row.querySelector('[data-phin]');
      if (ph) ph.onclick = () => pin.click();
      if (pin) pin.onchange = async () => {
        const f = pin.files[0]; if (!f) return;
        try { const x = d(); x.photoData = await resizeImage(f, 1280, 0.72); if (!x.status) x.status = c?.status || 'Kontrol edildi'; x.remove = false; x.dirty = true; rerow(pid); }
        catch (e) { showError(e); }
      };
    });
    el.querySelectorAll('img[data-up]').forEach(async (img) => { try { img.src = await ensureUpload(img.dataset.up); } catch { /* yoksay */ } });
    el.querySelector('[data-save]').onclick = () => save(false);
    el.querySelector('[data-submit]').onclick = () => save(true);
    el.querySelector('[data-finish]').onclick = finish;
  }
  function rerow(pid) {
    const row = el.querySelector(`[data-p="${pid}"]`); if (!row) return;
    const g = pc.groups.find((x) => x.id === group); const p = g.parts.find((x) => x.id === pid);
    row.outerHTML = partRow(p, mine()[pid]);
    bind(); updateCount();
    const gb = el.querySelector(`[data-g="${group}"] small`); if (gb) { const M = mine(); gb.textContent = `${g.parts.filter((q) => (draft[q.id] ? draft[q.id].status : M[q.id])).length} / ${g.parts.length} işaretli`; }
  }
  function updateCount() {
    const drafts = pc.checks.filter((c) => c.user_id === me.id && c.review_status === 'Taslak' && !draft[c.part_def_id]?.dirty).length;
    const dc = el.querySelector('[data-dc]'); if (dc) dc.textContent = dirtyCount() + drafts;
  }

  async function save(submit) {
    const items = Object.entries(draft).filter(([, x]) => x.dirty).map(([pid, x]) => {
      const c = mine()[Number(pid)];
      if (x.remove) return { part_def_id: Number(pid), remove: true, part_name: partName(Number(pid)) };
      const it = { part_def_id: Number(pid), status: x.status || c?.status, note: x.note ?? c?.note ?? '', part_name: partName(Number(pid)) };
      if (x.photoData) it.photoData = x.photoData; else it.photo = x.photo ?? c?.photo ?? null;
      return it;
    }).filter((x) => x.remove || x.status);
    if (!items.length && !submit) return toast('Değişiklik yok.');
    let note = '';
    if (submit) {
      const pendingAfter = items.filter((x) => !x.remove).length + pc.checks.filter((c) => c.user_id === me.id && (c.review_status === 'Taslak' || c.review_status === 'Düzeltme istendi') && !draft[c.part_def_id]?.dirty).length;
      if (!pendingAfter) return toast('Onaya gönderilecek işaretli parça yok. Önce parçaların durumunu seçin.', 'err');
      note = await confirmDialog(`<b>${pendingAfter}</b> parça işlemi yöneticiye onaya gönderilecek.`, { title: 'Onaya gönder', confirmText: 'Gönder', html: true, input: { label: 'Yöneticiye not (isteğe bağlı)' } });
      if (note === false) return;
    }
    const btns = el.querySelectorAll('.tb-bar .btn'); btns.forEach((b) => (b.disabled = true));
    try {
      const r = await submitOrQueue({ wo_id: job.wo_id, items, submit, note: note === true ? '' : note });
      if (r.queued) {
        Object.values(draft).forEach((x) => { if (x.dirty) { x.dirty = false; x.queued = true; } });
        toast('İnternet yok: kayıt tablette saklandı, bağlantı gelince otomatik gönderilecek.', 'err');
        render();
        return;
      }
      Object.keys(draft).forEach((k) => delete draft[k]);
      toast(submit ? 'Onaya gönderildi. Yönetici ekranına düştü.' : 'Kaydedildi.');
      pc = await get(`/api/workorders/${job.wo_id}/part-checks`);
      render();
    } catch (e) { showError(e); btns.forEach((b) => (b.disabled = false)); }
  }

  async function finish() {
    if (dirtyCount()) return toast('Kaydedilmemiş değişiklikler var. Önce "Onaya gönder" deyin.', 'err');
    const note = await confirmDialog('Bu araçtaki işiniz bitti mi? Görev "Tamamlandı" olur ve durumunuz "İşlem tamamlandı" olarak yöneticiye görünür.', { title: 'İşi bitir', confirmText: 'Evet, bitirdim', input: { label: 'Kısa not (isteğe bağlı)' } });
    if (note === false) return;
    try { await post(`/api/tablet/tasks/${job.task_id}/finish`, { note: note === true ? '' : note }); toast('İş tamamlandı. Eline sağlık!'); location.hash = '#/tablet'; }
    catch (e) { showError(e); }
  }

  render();
}

// ------------------------------------------------------------------ Personel takip panosu (yönetici)
async function staffBoard(el, _id, alive) {
  ensureStyle();
  const d = await get('/api/staff-board');

  if (!d || !/^\d{4}-\d{2}-\d{2}/.test(d)) return 9999;

  const [, m, g] = d.slice(0, 10).split('-').map(Number);
  let n = new Date(t.getFullYear(), m - 1, g); if (n < t) n = new Date(t.getFullYear() + 1, m - 1, g);
  return Math.round((n - t) / 86400000);
};

async function integrationForm(row = null, { kind = 'parca', supplierId = null } = {}) {
  const cat = (await get('/api/integration-catalog'));
  kind = row?.kind || kind;
  const provs = cat.providers[kind];
  const sups = kind === 'parca' ? (await get('/api/suppliers')).items : [];
  let provKey = row?.provider || provs[0].key;
  const m = openModal({ title: row ? `Entegrasyon: ${row.name}` : 'Yeni parça tedarikçisi entegrasyonu', size: 'lg', body: '<div data-f></div>',
    footer: `${row ? '<button class="btn" data-test style="margin-right:auto">Bağlantıyı test et</button>' : ''}<button class="btn" data-close>Kapat</button><button class="btn primary" data-save>Kaydet</button>` });
  let fields = [];
  const draw = () => {
    const p = provs.find((x) => x.key === provKey) || provs[0];
    fields = [
      { name: 'name', label: 'Entegrasyon adı', required: true, default: row?.name || cat.kinds[kind] },
      ...(provs.length > 1 ? [{ name: 'provider', label: 'Sağlayıcı / bağlantı türü', type: 'select', required: true, noEmpty: true, options: provs.map((x) => [x.key, x.label]) }] : []),
      ...(kind === 'parca' ? [{ name: 'supplier_id', label: 'Tedarikçi', type: 'select', required: true, options: sups.map((s) => [s.id, s.name]) }] : []),
      ...p.fields.map((f) => ({ name: (f.secret ? 's_' : 'c_') + f.name, label: f.label + (f.secret && row?.secrets_set?.includes(f.name) ? ' (kayıtlı — değiştirmek için yeni değer girin)' : ''), type: f.type === 'url' ? 'text' : f.type === 'select' ? 'select' : f.type === 'password' ? 'password' : f.type === 'email' ? 'email' : f.type === 'number' ? 'number' : 'text',
        options: f.options, required: f.required && !(f.secret && row?.secrets_set?.includes(f.name)), help: f.help, noEmpty: f.type === 'select', placeholder: f.secret && row?.secrets_set?.includes(f.name) ? '••••••••' : '' })),
    ];
    const vals = { name: row?.name || (kind === 'parca' ? '' : cat.kinds[kind]), provider: provKey, supplier_id: row?.supplier_id || supplierId };
    p.fields.forEach((f) => { if (!f.secret) vals['c_' + f.name] = f.name === 'api_url' ? row?.api_url : row?.config?.[f.name]; });
    m.body.innerHTML = `${window.MS_ONLINE ? '<div class="notice warn mb"><b>Çevrim içi sürüm:</b> Tarayıcı güvenliği nedeniyle bu sürüm dış sistemlere (tedarikçi API, SMTP e-posta, SMS, WhatsApp, e-fatura) bağlanamaz. Bu entegrasyonlar için uygulamanın sunuculu sürümünü (python server.py) kullanın.</div>' : ''}<div class="notice ${p.key === 'kurulmadi' ? 'warn' : ''} mb">${esc(p.description)}</div>
      ${row ? `<p>Durum: ${badge(row.status)} ${row.last_checked_at ? `<small class="muted">Son kontrol: ${fdt(row.last_checked_at)}</small>` : ''}</p>${row.last_error ? `<div class="notice danger small mb">${esc(row.last_error)}</div>` : ''}` : ''}
      <form novalidate>${formHtml(fields, vals)}<div class="form-msg"></div></form>
      ${p.fields.some((f) => f.secret) ? '<p class="small muted mt">🔒 Şifre ve API anahtarları sunucuda şifrelenmiş olarak saklanır ve bir daha ekranda gösterilmez.</p>' : ''}`;
    const form = m.body.querySelector('form'); bindForm(form, fields);
    form.querySelector('[name=provider]')?.addEventListener('change', (e) => { provKey = e.target.value; draw(); });
    if (p.key === 'kurulmadi') m.el.querySelector('[data-save]').hidden = false;
  };
  draw();
  m.el.querySelector('[data-save]').onclick = async () => {
    const form = m.body.querySelector('form');
    const { values, errors } = readForm(form, fields);
    if (Object.keys(errors).length) return showFieldErrors(form, errors);
    const body = { kind, provider: values.provider || provKey, name: values.name, supplier_id: values.supplier_id, config: {}, secrets: {} };
    Object.entries(values).forEach(([k, v]) => { if (k === 'c_api_url') body.api_url = v; else if (k.startsWith('c_')) body.config[k.slice(2)] = v; else if (k.startsWith('s_') && v) body.secrets[k.slice(2)] = v; });
    try {
      const r = row ? await put('/api/integrations/' + row.id, body) : await post('/api/integrations', body);
      toast('Entegrasyon ayarları kaydedildi. "Bağlı" durumu için bağlantı testini çalıştırın.'); m.close(); rerender();
      return r;
    } catch (e) { if (e.data?.field_errors) showFieldErrors(form, e.data.field_errors); form.querySelector('.form-msg').textContent = e.message; }
  };
  m.el.querySelector('[data-test]')?.addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.classList.add('loading');
    try { const r = await post(`/api/integrations/${row.id}/test`); toast(r.message, r.ok ? 'ok' : 'err'); m.close(); rerender(); }
    catch (er) { showError(er); } finally { e.target.disabled = false; e.target.classList.remove('loading'); }
  });
}

function annotate({ src, marks = [], title = 'Arıza noktası işaretle', readOnly = false }) {
  return new Promise((resolve) => {
    let cur = marks.map((m) => ({ ...m }));
    let saved = false;
    const m = openModal({
      title, size: 'lg',
      body: `${readOnly ? '' : '<p class="muted small">Görsel üzerinde arızalı / kontrol edilecek noktaya dokunun/tıklayın; her işaret için açıklama yazın.</p>'}
        <div style="text-align:center"><div class="annot-stage"><img src="${src}" alt="İşaretlenecek görsel" draggable="false"><div data-marks></div></div></div>
        <ol class="annot-list" data-list></ol>`,
      footer: readOnly ? '<button class="btn" data-close>Kapat</button>' : '<button class="btn" data-clear>Tümünü temizle</button><button class="btn" data-close>Vazgeç</button><button class="btn primary" data-save>Kaydet</button>',
      onClose: () => { if (!saved) resolve(null); },
    });
    const stage = m.el.querySelector('.annot-stage');
    const draw = () => {
      m.el.querySelector('[data-marks]').innerHTML = cur.map((k, i) => `<span class="mark" style="left:${k.x * 100}%;top:${k.y * 100}%" data-i="${i}">${i + 1}</span>`).join('');
      m.el.querySelector('[data-list]').innerHTML = cur.length ? cur.map((k, i) => `<li><span class="num">${i + 1}</span>${readOnly ? `<span>${esc(k.note || '—')}</span>` : `<input class="inp" data-note="${i}" value="${esc(k.note || '')}" placeholder="Örn. ön tampon sağ köşe çizik" maxlength="300"><button class="btn sm danger-o" data-rm="${i}" aria-label="İşareti sil">✕</button>`}</li>`).join('') : '<li class="muted">Henüz işaret yok.</li>';
      m.el.querySelectorAll('[data-note]').forEach((inp) => (inp.oninput = () => { cur[+inp.dataset.note].note = inp.value; }));
      m.el.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { cur.splice(+b.dataset.rm, 1); draw(); }));
    };
    if (!readOnly) {
      stage.querySelector('img').addEventListener('click', (e) => {
        const r = e.target.getBoundingClientRect();
        cur.push({ x: +((e.clientX - r.left) / r.width).toFixed(4), y: +((e.clientY - r.top) / r.height).toFixed(4), note: '' });
        draw();
        setTimeout(() => m.el.querySelector(`[data-note="${cur.length - 1}"]`)?.focus(), 30);
      });
      m.el.querySelector('[data-clear]').onclick = () => { cur = []; draw(); };
      m.el.querySelector('[data-save]').onclick = () => { saved = true; m.close(); resolve(cur); };
    }
    draw();
  });
}

    { name: 'complaint', label: 'Müşteri şikâyeti', type: 'textarea', required: true, full: true, placeholder: 'Müşterinin anlattığı sorun' },
    { name: 'requested_work', label: 'Yapılacak / istenen işlemler', type: 'textarea', full: true, rows: 2 },
    { name: 'km_in', label: 'Kilometre', type: 'number', required: true, min: 0, placeholder: preVehicle?.km ? 'Son kayıt: ' + num(preVehicle.km) : '' },
    { name: 'fuel_level', label: 'Yakıt seviyesi', type: 'select', options: state.meta.fuel_levels },
    { name: 'keys_received', label: 'Teslim alınan anahtar', placeholder: 'Örn. 1 anahtar + kumanda', default: '1 adet anahtar' },
    { name: 'belongings', label: 'Araçtaki özel eşyalar', placeholder: 'Örn. çocuk koltuğu, ruhsat', default: '' },
    { name: 'entry_at', label: 'Servise giriş tarihi', type: 'datetime', required: true, default: nowLocal() },
    { name: 'estimated_at', label: 'Tahmini teslim tarihi', type: 'datetime', required: true, default: nowLocal(24),
      validate: (v, all) => (all.entry_at && v < all.entry_at ? 'Giriş tarihinden önce olamaz.' : '') },
    { name: 'priority', label: 'Öncelik', type: 'select', options: state.meta.priorities, required: true, noEmpty: true, default: 'Normal' },
    { name: 'advisor_id', label: 'Servis danışmanı', type: 'select', options: users.filter((u) => ['danisman', 'yonetici'].includes(u.role)).map((u) => [u.id, u.full_name]), default: state.user.id },
    ...(can('tasks.assign') ? [{ name: 'assign_to', label: 'Boştaki personele iş aktar', type: 'multicheck', full: true,
        options: users.filter((u) => u.role === 'teknisyen' && u.active !== 0 && ['Müsait', 'İşlem tamamlandı', undefined].includes(u.staff_status)).map((u) => [u.id, `🟢 ${u.full_name} — ${u.staff_status || 'Müsait'}`]),
        help: (() => { const b = users.filter((u) => u.role === 'teknisyen' && ['İş üzerinde', 'Molada'].includes(u.staff_status)); return b.length ? 'Meşgul: ' + b.map((u) => `${u.full_name} (${u.staff_status})`).join(', ') + ' — bir personele aynı anda tek aktif iş verilir.' : 'Bir personele aynı anda tek aktif iş verilir.'; })() },
      { name: 'task_title', label: 'Görev açıklaması', default: 'Arıza tespiti / kontrol', full: true }] : []),
    { name: 'intake_notes', label: 'Kabul notları', type: 'textarea', full: true, rows: 2 },
  ];
  const values = { complaint: appt?.service || '', requested_work: appt ? appt.service : '', customer_id: preCustomer?.id, vehicle_id: preVehicle?.id };
  el.innerHTML = `<a class="back" href="#/is-emirleri">‹ İş emirleri</a>${pageHead('Araç Kabul ve Yeni İş Emri', '', appt ? `Randevudan kabul: ${fdate(appt.date)} ${esc(appt.time)}` : 'Kayıt sonrasında servis numarası ve iş emri otomatik oluşturulur.')}
  <form novalidate class="grid g-main">
    <div><div class="card"><h2>Müşteri, araç ve kabul bilgileri</h2>${formHtml(fields, values)}</div></div>
    <div>
      <div class="card"><div class="card-head"><h3>Motor arıza / kontrol noktaları</h3><button type="button" class="btn sm" data-damage>İşaretle</button></div>
        <div class="diagram-box" style="margin:auto"><div class="annot-stage" style="width:100%"><img src="${CAR_SVG}" style="width:100%" alt="Motor şeması"><div data-dmarks></div></div></div><ol class="annot-list small" data-dlist></ol></div>
      <div class="card"><h3 class="mb">Araç fotoğrafları</h3>
        <div class="upload-zone"><label class="block">Kategori<select class="inp" data-pcat>${state.meta.photo_categories.filter((c) => c !== 'Teslim').map((c) => `<option>${c}</option>`).join('')}</select></label>
          <div class="btns"><label class="btn primary">📷 Fotoğraf çek<input type="file" accept="image/*" capture="environment" hidden data-cam></label>
          <label class="btn">🖼 Dosyadan yükle<input type="file" accept="image/*" multiple hidden data-file></label></div></div>
        <div class="photo-grid mt" data-pending></div></div>
      <div class="card"><div class="form-msg" role="alert"></div><button class="btn primary block lg" type="submit">Aracı kabul et ve iş emri oluştur</button></div>
    </div>
  </form>`;
  const form = el.querySelector('form');
  bindForm(form, fields);
  const drawDamage = () => {
    el.querySelector('[data-dmarks]').innerHTML = marksHtml(damage);
    el.querySelector('[data-dlist]').innerHTML = damage.map((d) => `<li><span class="num">${damage.indexOf(d) + 1}</span>${esc(d.note || '(açıklama yok)')}</li>`).join('');
  };
  el.querySelector('[data-damage]').onclick = async () => { const r = await annotate({ src: CAR_SVG, marks: damage, title: 'Motor şeması üzerinde arıza noktası işaretle' }); if (r) { damage = r; drawDamage(); } };
  const drawPending = () => {
    el.querySelector('[data-pending]').innerHTML = pending.map((p, i) => `<div class="photo"><div class="img-box"><img src="${p.data}" alt="">${marksHtml(p.annotations)}</div>
      <div class="meta"><b>${esc(p.category)}</b><input class="inp" style="min-height:32px;font-size:.85rem" placeholder="Açıklama" value="${esc(p.caption)}" data-cap="${i}"></div>
      <div class="acts"><button type="button" class="btn sm" data-ann="${i}">İşaretle</button><button type="button" class="btn sm danger-o" data-rmp="${i}">Kaldır</button></div></div>`).join('');
    el.querySelectorAll('[data-cap]').forEach((inp) => (inp.oninput = () => { pending[+inp.dataset.cap].caption = inp.value; }));
    el.querySelectorAll('[data-rmp]').forEach((b) => (b.onclick = () => { pending.splice(+b.dataset.rmp, 1); drawPending(); }));
    el.querySelectorAll('[data-ann]').forEach((b) => (b.onclick = async () => { const p = pending[+b.dataset.ann]; const r = await annotate({ src: p.data, marks: p.annotations }); if (r) { p.annotations = r; drawPending(); } }));
  };
  const addFiles = async (files) => {
    for (const f of files) {
      try { pending.push({ data: await resizeImage(f), category: el.querySelector('[data-pcat]').value, caption: '', annotations: [] }); } catch (e) { showError(e); }
    }
    drawPending();
  };
  el.querySelector('[data-cam]').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  el.querySelector('[data-file]').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const { values: v, errors } = readForm(form, fields);
    const msg = form.querySelector('.form-msg'); msg.textContent = '';
    if (Object.keys(errors).length) { showFieldErrors(form, errors); msg.textContent = 'Lütfen işaretli alanları düzeltin.'; return; }
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.classList.add('loading');
    try {
      const body = { ...v, damage_marks: damage, appointment_id: appt?.id };
      const r = await withConfirm((b) => post('/api/workorders', b), body);
      let failed = 0;
      for (const p of pending) { try { await post(`/api/workorders/${r.id}/photos`, p); } catch { failed++; } }
      toast(`${r.wo_no} numaralı iş emri oluşturuldu.` + (failed ? ` ${failed} fotoğraf yüklenemedi.` : ''), failed ? 'warn' : 'ok');
      location.hash = `#/is-emirleri/${r.id}?yeni=1`;
    } catch (err) {
      if (err.cancelled) return;
      if (err.data?.field_errors) showFieldErrors(form, err.data.field_errors);
      msg.textContent = err.message;
    } finally { btn.disabled = false; btn.classList.remove('loading'); }
  });
}

const NEXT = {
  'Kabul Edildi': ['Kontrol Bekliyor', 'İşlemde'], 'Kontrol Bekliyor': ['Teklif Hazırlanıyor', 'İşlemde'], 'Teklif Hazırlanıyor': ['Müşteri Onayı Bekliyor'],
  'Müşteri Onayı Bekliyor': ['İşlemde'], 'İşlemde': ['Parça Bekliyor', 'Kontrol Ediliyor'], 'Parça Bekliyor': ['İşlemde'], 'Kontrol Ediliyor': ['Teslime Hazır', 'İşlemde'],

};

async function detail(el, id, alive) {

  const q = routeQuery();
  const tab = q.tab || 'genel';

  const pricing = can('workorders.pricing');
  el.innerHTML = `<a class="back" href="#/is-emirleri">‹ İş emirleri</a>
  ${q.yeni ? `<div class="notice ok mb">İş emri oluşturuldu. <button class="btn sm" data-print="kabul">Araç kabul formunu yazdır / PDF</button></div>` : ''}
  <div class="page-head"><div><h1>${esc(w.wo_no)} ${badge(w.status)} ${w.priority !== 'Normal' ? badge(w.priority) : ''}${sampleBadge(w)}</h1>
    <p class="muted"><b>${esc(d.vehicle.plate)}</b> • ${esc(d.vehicle.brand)} ${esc(d.vehicle.model)} • ${esc(d.customer.name)} ${late ? '<span class="late"> • Gecikmiş!</span>' : ''}</p></div>
    <div class="actions">
      ${can('workorders.status') ? `${(NEXT[w.status] || []).map((s) => `<button class="btn ${s === 'Teslim Edildi' || s === 'Teslime Hazır' ? 'success' : 'primary'}" data-st="${esc(s)}">→ ${esc(s)}</button>`).join('')}
        <button class="btn" data-st-any>Durum değiştir</button>` : ''}
      <div class="dropdown" style="position:relative"><button class="btn" data-print-menu>🖨 Yazdır / PDF ▾</button>
        <div class="combo-list" data-pm hidden style="min-width:230px;right:0;left:auto">
          <button class="combo-item" data-print="kabul">Araç kabul formu</button><button class="combo-item" data-print="isemri">İş emri</button>
          ${pricing || fin ? '<button class="combo-item" data-print="teslim">Teslim ve yapılan işlemler formu</button>' : ''}</div></div>
      ${can('workorders.delete') ? '<button class="btn danger-o" data-del>Sil</button>' : ''}
    </div></div>
  <div class="grid g-main">
    <div>
      ${tabs([{ id: 'genel', label: 'Genel' }, { id: 'kalemler', label: 'İşlemler ve Parçalar', count: d.items.length }, { id: 'gorevler', label: 'Görevler', count: d.tasks.length }, { id: 'parcalar', label: 'Parça Kontrolleri (Tablet)' },
      { id: 'fotograflar', label: 'Fotoğraflar', count: d.photos.length }, { id: 'odemeler', label: 'Ödemeler', count: d.payments?.length, show: fin }, { id: 'tarihce', label: 'Tarihçe' }], tab)}
      <div data-body></div>
    </div>
    <div>
      <div class="card"><h3 class="mb">Müşteri ve araç</h3><dl class="kv">
        <dt>Müşteri</dt><dd>${can('customers.view') ? `<a href="#/musteriler/${d.customer.id}">${esc(d.customer.name)}</a>` : esc(d.customer.name)}</dd>
        <dt>Telefon</dt><dd>${telLink(d.customer.phone)}</dd>
        <dt>Araç</dt><dd><a href="#/araclar/${d.vehicle.id}">${esc(d.vehicle.plate)}</a> — ${esc(d.vehicle.brand)} ${esc(d.vehicle.model)} ${d.vehicle.year || ''}</dd>
        <dt>Giriş KM</dt><dd>${w.km_in ? num(w.km_in) : '—'}</dd><dt>Giriş</dt><dd>${fdt(w.entry_at)}</dd>
        <dt>Tahmini teslim</dt><dd class="${late ? 'late' : ''}">${fdt(w.estimated_at)}</dd>${w.delivered_at ? `<dt>Teslim</dt><dd>${fdt(w.delivered_at)}</dd>` : ''}
        <dt>Danışman</dt><dd>${esc(d.advisor?.full_name || '—')}</dd></dl></div>
      ${pricing || fin ? `<div class="card"><div class="card-head"><h3>Tutarlar</h3>${pricing && !closed ? '<button class="btn sm" data-pricing>İndirim / KDV</button>' : ''}</div>
        <table class="totals" style="max-width:none"><tr><td>Parça</td><td>${money(t.parts_total)}</td></tr><tr><td>İşçilik</td><td>${money(t.labor_total)}</td></tr>
        ${t.other_total ? `<tr><td>Diğer</td><td>${money(t.other_total)}</td></tr>` : ''}<tr><td>Ara toplam</td><td>${money(t.subtotal)}</td></tr>
        ${t.discount ? `<tr><td>İndirim</td><td>-${money(t.discount)}</td></tr>` : ''}<tr><td>KDV (%${num(t.tax_rate)})</td><td>${money(t.tax)}</td></tr>
        <tr class="grand"><td>Toplam</td><td>${money(t.total)}</td></tr>${fin ? `<tr><td>Ödenen</td><td>${money(t.paid)}</td></tr><tr class="${t.balance > 0.009 ? 'bal' : ''}"><td><b>Kalan</b></td><td>${money(t.balance)}</td></tr>` : ''}</table>

      onSubmit: async (v) => { setTimeout(() => changeStatus(v.status), 10); },

  });

    if (!(await confirmDialog(`<b>${esc(w.wo_no)}</b> kalıcı olarak silinecek. Kullanılan parçalar stoğa iade edilir. Bu işlem geri alınamaz; çoğu durumda "İptal" durumunu kullanmanız önerilir.`, { danger: true, html: true, confirmText: 'Kalıcı olarak sil', requireText: 'SİL' }))) return;
    try { await del('/api/workorders/' + w.id); toast('İş emri silindi.'); location.hash = '#/is-emirleri'; } catch (e) { showError(e); }
  });
  el.querySelector('[data-pricing]')?.addEventListener('click', () => formModal({
    title: 'İndirim ve KDV', size: 'sm',
    fields: [{ name: 'discount', label: 'İndirim (TL)', type: 'money', default: t.discount }, { name: 'tax_rate', label: 'KDV oranı (%)', type: 'number', min: 0, max: 100, default: t.tax_rate }],
    onSubmit: async (v) => { await put('/api/workorders/' + w.id, v); toast('Tutarlar güncellendi.'); rerender(); },
  }));
  el.querySelector('[data-pay]')?.addEventListener('click', () => paymentForm(d));

  const body = el.querySelector('[data-body]');
  const show = (k) => {
    setQuery({ tab: k, yeni: '' });

  };
  el.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => show(b.dataset.tab)));
  show(tab);
}

async function itemForm(d, type, item = null) {

      onSelect: (it) => { selectedPart = it.part; const f = document.querySelector('.modal-wrap:last-child'); f.querySelector('[name=description]').value = it.part.name; const up = f.querySelector('[name=unit_price]'); if (up) up.value = num(it.part.sell_price); f.querySelector('[data-stockinfo]').innerHTML = `Mevcut stok: <b>${num(it.part.stock)} ${esc(it.part.unit || '')}</b>${it.part.stock <= 0 ? ' — <span class="late">stokta yok</span>' : ''}`; } });

  }
  fields.push({ name: 'description', label: type === 'İşçilik' ? 'Yapılan işlem / işçilik açıklaması' : 'Açıklama', required: true, full: true });
  fields.push({ name: 'qty', label: type === 'İşçilik' ? 'Miktar / saat' : 'Miktar', type: 'number', required: true, positive: true, default: 1, step: 'any' });
  if (pricing) fields.push({ name: 'unit_price', label: 'Birim fiyat (KDV hariç)', type: 'money', required: type !== 'Parça' || !!item });
  if (pricing && type === 'Diğer' && !item) fields.push({ name: 'cost_price', label: 'Maliyet (alış)', type: 'money' });

      delete v._info;

}

}

function scanBarcode(onCode) {
  if (!('BarcodeDetector' in window)) { toast('Bu tarayıcı kamerayla barkod okumayı desteklemiyor. USB/Bluetooth barkod okuyucu ile arama kutusuna okutabilirsiniz.', 'warn'); return; }
  const m = openModal({ title: 'Barkod okut', body: '<video playsinline muted style="width:100%;border-radius:8px;background:#000"></video><p class="muted small">Barkodu kameraya gösterin.</p>' });
  const video = m.el.querySelector('video');
  let stream, stop = false;
  const det = new window.BarcodeDetector();
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(async (s) => {
    stream = s; video.srcObject = s; await video.play();
    const loop = async () => {
      if (stop) return;
      try { const codes = await det.detect(video); if (codes.length) { stop = true; m.close(); onCode(codes[0].rawValue); return; } } catch { /* devam */ }
      requestAnimationFrame(loop);
    };
    loop();
  }).catch(() => { m.close(); toast('Kameraya erişilemedi. Tarayıcı izinlerini kontrol edin.', 'err'); });
  const obs = new MutationObserver(() => { if (!document.body.contains(m.el)) { stop = true; stream?.getTracks().forEach((t) => t.stop()); obs.disconnect(); } });
  obs.observe(document.body, { childList: true });
}

  body.innerHTML = `<div class="card" style="max-width:820px"><h3 class="mb">${title}</h3>${intro}<form novalidate>${formHtml(fields, values)}<div class="form-msg"></div><button class="btn primary mt">Kaydet</button></form></div>`;
  const f = body.querySelector('form'); bindForm(f, fields);
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const { values: v, errors } = readForm(f, fields);
    if (Object.keys(errors).length) return showFieldErrors(f, errors);
    try { await onSubmit(v, f); } catch (er) { if (er.data?.field_errors) showFieldErrors(f, er.data.field_errors); f.querySelector('.form-msg').textContent = er.message; }
  });
}

function forcePasswordScreen() {
  const fields = [
    { name: 'current', label: 'Mevcut şifre', type: 'password', required: true },
    { name: 'new', label: 'Yeni şifre', type: 'password', required: true, help: 'En az 8 karakter', validate: (v) => (v.length < 8 ? 'En az 8 karakter olmalı.' : '') },
    { name: 'again', label: 'Yeni şifre (tekrar)', type: 'password', required: true },
  ];
  document.getElementById('app').innerHTML = `<div class="login-wrap"><form class="login-card" novalidate>
    <h2>Şifrenizi değiştirin</h2><p class="muted">Güvenliğiniz için ilk girişte veya şifreniz sıfırlandığında yeni şifre belirlemeniz gerekir.</p>
    ${formHtml(fields)}<div class="form-msg" role="alert"></div><button class="btn primary block lg">Kaydet ve devam et</button>
    <button type="button" class="btn ghost block mt" data-logout>Çıkış yap</button></form></div>`;
  const f = document.querySelector('form'); bindForm(f, fields);
  f.querySelector('[data-logout]').onclick = logout;
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const { values, errors } = readForm(f, fields);
    if (values.new && values.again !== values.new) errors.again = 'Şifreler eşleşmiyor.';
    if (Object.keys(errors).length) return showFieldErrors(f, errors);
    try { await post('/api/me/password', values); toast('Şifreniz değiştirildi.'); const r = await get('/api/me'); startApp(r.user); }
    catch (err) { if (err.data?.field_errors) showFieldErrors(f, err.data.field_errors); f.querySelector('.form-msg').textContent = err.message; }
  });
}

async function logout() { try { await post('/api/logout'); } catch { /* yoksay */ } state.user = null; location.hash = ''; loginScreen(); }

function layout() {
  const items = MENU.filter((m) => !m.perm || can(...m.perm));
  const bottom = (state.user.role === 'teknisyen' ? ['tablet', 'is-emirleri', 'personel', 'bildirimler'] : ['panel', 'is-emirleri', 'musteriler', 'bildirimler']).map((id) => items.find((m) => m.id === id)).filter(Boolean);
  document.getElementById('app').innerHTML = `

function bindGlobalSearch() {
  const inp = document.getElementById('gsearch'), box = inp.parentElement.querySelector('.gsearch-res');
  const run = debounce(async () => {
    const q = inp.value.trim();
    if (q.length < 2) { box.hidden = true; return; }
    try {
      const r = await get('/api/search?q=' + encodeURIComponent(q));
      const sec = (title, arr, fn) => (arr.length ? `<h6>${title}</h6>` + arr.map(fn).join('') : '');
      const html = sec('İş Emirleri', r.workorders, (w) => `<a href="#/is-emirleri/${w.id}"><b>${esc(w.wo_no)}</b> ${esc(w.plate)} <small>${esc(w.customer_name)} • ${esc(w.status)}</small></a>`) +
        sec('Araçlar', r.vehicles, (v) => `<a href="#/araclar/${v.id}"><b>${esc(v.plate)}</b> ${esc(v.brand)} ${esc(v.model)} <small>${esc(v.customer_name)}</small></a>`) +
        sec('Müşteriler', r.customers, (c) => `<a href="#/musteriler/${c.id}"><b>${esc(c.name)}</b> <small>${esc(c.phone || '')}</small></a>`);
      box.innerHTML = html || '<div class="muted pad">Sonuç bulunamadı.</div>';
      box.hidden = false;
    } catch (e) { showError(e); }
  }, 250);
  inp.addEventListener('input', run);
  inp.addEventListener('focus', () => { if (inp.value.trim().length >= 2) run(); });
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const a = box.querySelector('a'); if (a) { location.hash = a.getAttribute('href'); box.hidden = true; inp.blur(); } } if (e.key === 'Escape') box.hidden = true; });
  box.addEventListener('click', (e) => { if (e.target.closest('a')) { box.hidden = true; inp.value = ''; } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.gsearch')) box.hidden = true; });
}

function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const ctx = window._beepCtx || (window._beepCtx = new A());
    [0, 0.18].forEach((t, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = i ? 1175 : 880; g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.16); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.17); });
  } catch { /* ses yok */ }
}
document.addEventListener('click', () => { try { if (window._beepCtx?.state === 'suspended') window._beepCtx.resume(); else if (!window._beepCtx) { const A = window.AudioContext || window.webkitAudioContext; if (A) window._beepCtx = new A(); } } catch { /* yoksay */ } }, { once: false, passive: true });
async function refreshNotifCount() {
  if (!can('notifications')) return;
  try {
    const r = await get('/api/notifications/count');
    const prev = window._lastUnread;
    window._lastUnread = r.unread;
    if (prev !== undefined && r.unread > prev) { beep(); toast('🔔 Yeni bildirim: ' + (r.unread - prev) + ' adet'); if (/^#\/(personel-takip|tablet)/.test(location.hash) && !document.querySelector('.modal-wrap')) router(); }
    document.querySelectorAll('[data-ncount]').forEach((b) => { b.hidden = !r.unread; b.textContent = r.unread > 99 ? '99+' : r.unread; });
  } catch { /* sessiz */ }
}

let renderSeq = 0;
async function router() {
  if (!state.user) return;
  let h = location.hash.replace(/^#\/?/, '').split('?')[0];
  if (!h && state.user.role === 'teknisyen') { location.replace('#/tablet'); return; }
  if (!h) { const first = MENU.find((m) => !m.perm || can(...m.perm)); location.replace('#/' + first.id); return; }
  const page = document.getElementById('page');
  document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('active', h === a.dataset.nav || h.startsWith(a.dataset.nav + '/')));
  const r = ROUTES.find(([rx]) => rx.test(h));
  const seq = ++renderSeq;
  if (!r) { page.innerHTML = '<div class="empty big">Sayfa bulunamadı. <a href="#/panel">Panele dön</a></div>'; return; }
  if (r[2] && !can(...r[2])) { page.innerHTML = '<div class="empty big">Bu sayfayı görüntüleme yetkiniz yok.</div>'; return; }
  const m = h.match(r[0]);
  page.innerHTML = loading();
  window.scrollTo(0, 0);
  try { await r[1](page, m[1] ? Number(m[1]) : undefined, () => seq === renderSeq); }
  catch (e) { if (seq === renderSeq) { page.innerHTML = errorBox(e); console.error(e); } }
  refreshNotifCount();
}
function rerender() { router(); }

async function startApp(user) {
  state.user = user;
  state.perms = new Set(user.permissions);
  if (user.must_change_password) return forcePasswordScreen();
  state.meta = await get('/api/meta');
  layout();
  await router();
  clearInterval(window._nTimer);
  window._lastUnread = undefined;
  window._nTimer = setInterval(refreshNotifCount, 20000);
}

window.addEventListener('hashchange', router);
window.addEventListener('ms:unauthorized', () => { if (state.user) { state.user = null; loginScreen('Oturumunuz sona erdi. Lütfen tekrar giriş yapın.'); } });
window.addEventListener('unhandledrejection', (e) => { showError(e.reason); });

(async function boot() {
  try { const r = await get('/api/me'); await startApp(r.user); }
  catch (e) { if (e.status === 401) loginScreen(); else document.getElementById('app').innerHTML = errorBox(e); }
})();

Object.assign(__M["app"], { icon, refreshNotifCount, rerender });
})();
